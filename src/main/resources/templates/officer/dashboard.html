<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Officer Dashboard')}">
    <link th:href="@{/css/officer.css}" rel="stylesheet"/>
</head>
<body>
<div class="cr-dashboard-layout">
    <th:block th:replace="~{fragments/officer-sidebar :: officer-sidebar}"/>
    <div class="cr-dashboard-main">
        <div class="cr-topbar">
            <h1 class="cr-topbar-title">Officer Dashboard</h1>
            <a th:href="@{/officer/notifications}" class="text-muted"><i class="fa-solid fa-bell fa-lg"></i></a>
        </div>
        <div class="cr-page-content">
            <th:block th:replace="~{fragments/alerts :: alerts}"/>
            <div class="mb-4">
                <h4 class="fw-700 mb-1">Assigned complaints</h4>
                <p class="text-muted small mb-0">Complaints assigned to you will appear here.</p>
            </div>
            <div class="cr-card p-4 text-center text-muted">
                <i class="fa-regular fa-folder-open fa-2x mb-2"></i>
                <p class="mb-0">No complaints are assigned to you.</p>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
