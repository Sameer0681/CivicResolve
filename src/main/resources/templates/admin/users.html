<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Users')}">
    <link th:href="@{/css/admin.css}" rel="stylesheet"/>
</head>
<body>
<div class="cr-dashboard-layout">
    <th:block th:replace="~{fragments/admin-sidebar :: admin-sidebar}"/>
    <div class="cr-dashboard-main">
        <div class="cr-topbar">
            <div class="d-flex align-items-center gap-2">
                <h1 class="cr-topbar-title">User Management</h1>
            </div>
        </div>
        <div class="cr-page-content">
            <th:block th:replace="~{fragments/alerts :: alerts}"/>

            <div class="cr-card mb-4">
                <div class="cr-card-header">
                    <h2 class="h6 fw-700 mb-0">Create officer account</h2>
                </div>
                <div class="cr-card-body">
                    <form method="post" th:action="@{/admin/users/officer}" class="row g-3">
                        <div class="col-md-4">
                            <label class="cr-form-label" for="officerName">Full name</label>
                            <input id="officerName" name="name" class="form-control" maxlength="160" required/>
                        </div>
                        <div class="col-md-4">
                            <label class="cr-form-label" for="officerEmail">Email</label>
                            <input id="officerEmail" name="email" type="email" class="form-control" maxlength="150" required/>
                        </div>
                        <div class="col-md-4">
                            <label class="cr-form-label" for="officerPassword">Temporary password</label>
                            <input id="officerPassword" name="password" type="password" class="form-control"
                                   minlength="6" autocomplete="new-password" required/>
                        </div>
                        <div class="col-md-6">
                            <label class="cr-form-label" for="officerDepartment">Department</label>
                            <select id="officerDepartment" name="department" class="form-select" required>
                                <option value="">Choose department</option>
                                <option th:each="department : ${officerDepartments}"
                                        th:value="${department}" th:text="${department}">Department</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="cr-form-label" for="officerPhone">Phone (optional)</label>
                            <input id="officerPhone" name="phone" type="tel" class="form-control" maxlength="20"/>
                        </div>
                        <div class="col-md-2 d-flex align-items-end">
                            <button class="btn btn-primary w-100" type="submit">Create officer</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Stats -->
            <div class="row g-3 mb-4">
                <div class="col-6 col-md-4">
                    <div class="cr-stat-card">
                        <div class="cr-stat-icon cr-stat-icon--blue"><i class="fa-solid fa-users"></i></div>
                        <div><div class="cr-stat-value" th:text="${totalUsers}">0</div><div class="cr-stat-label">Total Users</div></div>
                    </div>
                </div>
                <div class="col-6 col-md-4">
                    <div class="cr-stat-card">
                        <div class="cr-stat-icon cr-stat-icon--purple"><i class="fa-solid fa-user-shield"></i></div>
                        <div><div class="cr-stat-value" th:text="${officerCount}">0</div><div class="cr-stat-label">Officers</div></div>
                    </div>
                </div>
                <div class="col-6 col-md-4">
                    <div class="cr-stat-card">
                        <div class="cr-stat-icon cr-stat-icon--orange"><i class="fa-solid fa-user-tie"></i></div>
                        <div><div class="cr-stat-value" th:text="${adminCount}">0</div><div class="cr-stat-label">Admins</div></div>
                    </div>
                </div>
            </div>

            <!-- Filters -->
            <div class="cr-card mb-4">
                <div class="cr-card-body">
                    <form method="get" th:action="@{/admin/users}" class="row g-3 align-items-end">
                        <div class="col-md-5">
                            <label class="cr-form-label" for="userSearch">Search</label>
                            <div class="cr-input-icon-wrap">
                                <i class="cr-input-icon fa-solid fa-search"></i>
                                <input type="search" id="userSearch" name="search" class="form-control"
                                       placeholder="Search by name or email..." th:value="${search}"/>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <label class="cr-form-label" for="userRole">Role</label>
                            <select id="userRole" name="role" class="form-select">
                                <option value="" th:selected="${roleFilter == ''}">All Roles</option>
                                <option value="ROLE_CITIZEN" th:selected="${roleFilter == 'ROLE_CITIZEN'}">Citizen</option>
                                <option value="ROLE_OFFICER" th:selected="${roleFilter == 'ROLE_OFFICER'}">Officer</option>
                                <option value="ROLE_ADMIN" th:selected="${roleFilter == 'ROLE_ADMIN'}">Admin</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <label class="cr-form-label" for="userStatus">Status</label>
                            <select id="userStatus" name="status" class="form-select">
                                <option value="" th:selected="${statusFilter == ''}">All</option>
                                <option value="true" th:selected="${statusFilter == 'true'}">Active</option>
                                <option value="false" th:selected="${statusFilter == 'false'}">Inactive</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <button class="btn btn-primary w-100" type="submit">Filter</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Users Table -->
            <div class="cr-card">
                <div class="table-responsive">
                    <table class="cr-table cr-user-row">
                        <thead>
                            <tr>
                                <th>User</th>
                                <th>Email</th>
                                <th>Role</th>
                                <th>Department</th>
                                <th>Joined</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="user : ${users}">
                                <td th:text="${user.fullName}"></td>
                                <td class="text-muted small" th:text="${user.email}"></td>
                                <td th:text="${user.role}"></td>
                                <td class="text-muted small" th:text="${user.department} ?: '—'"></td>
                                <td class="text-muted small" th:text="${user.createdAt}"></td>
                                <td>
                                    <span th:if="${user.enabled}" class="badge bg-success-subtle text-success">Active</span>
                                    <span th:unless="${user.enabled}" class="badge bg-secondary-subtle text-secondary">Inactive</span>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(users)}">
                                <td colspan="6" class="text-center text-muted py-4">No users match these filters.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
