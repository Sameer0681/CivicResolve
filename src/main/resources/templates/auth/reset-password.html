<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Reset Password')}">
    <link th:href="@{/css/auth.css}" rel="stylesheet"/>
</head>
<body>
<div class="cr-auth-page">
    <div class="cr-auth-panel">
        <a th:href="@{/}" class="d-flex align-items-center gap-2 text-decoration-none mb-4">
            <div class="cr-logo-icon"><i class="fa-solid fa-landmark"></i></div>
            <span class="cr-brand-text">Civic<span class="cr-brand-accent">Resolve</span></span>
        </a>

        <div class="mb-4">
            <div style="width:56px;height:56px;background:var(--cr-primary-light);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.4rem;color:var(--cr-primary);margin-bottom:1rem;">
                <i class="fa-solid fa-lock-open"></i>
            </div>
            <h1 class="cr-auth-title">Set new password</h1>
            <p class="cr-auth-subtitle">Your new password must be at least 8 characters.</p>
        </div>

        <th:block th:replace="~{fragments/alerts :: alerts}"/>

        <form th:action="@{/reset-password}" method="post">
            <input type="hidden" name="token" th:value="${token}"/>
            <div class="mb-3">
                <label class="cr-form-label">New Password</label>
                <div class="cr-input-icon-wrap position-relative">
                    <i class="cr-input-icon fa-solid fa-lock"></i>
                    <input type="password" name="password" id="newPass" class="form-control" placeholder="Min. 8 characters" required/>
                    <button type="button" class="cr-password-toggle" onclick="togglePassword('newPass', this)">
                        <i class="fa-solid fa-eye"></i>
                    </button>
                </div>
            </div>
            <div class="mb-4">
                <label class="cr-form-label">Confirm New Password</label>
                <div class="cr-input-icon-wrap position-relative">
                    <i class="cr-input-icon fa-solid fa-lock"></i>
                    <input type="password" name="confirmPassword" id="confirmPass" class="form-control" placeholder="Repeat password" required/>
                    <button type="button" class="cr-password-toggle" onclick="togglePassword('confirmPass', this)">
                        <i class="fa-solid fa-eye"></i>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fw-600">
                <i class="fa-solid fa-check me-2"></i>Reset Password
            </button>
        </form>

        <p class="text-center text-muted small mt-4 mb-0">
            <a th:href="@{/login}" class="fw-600 text-decoration-none">Back to login</a>
        </p>
    </div>

    <div class="cr-auth-visual">
        <div class="cr-auth-visual-content">
            <div class="cr-auth-visual-icon"><i class="fa-solid fa-shield-halved"></i></div>
            <h2>Secure your account</h2>
            <p>Choose a strong, unique password to keep your CivicResolve account safe.</p>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
function togglePassword(id, btn) {
    const input = document.getElementById(id);
    const icon = btn.querySelector('i');
    input.type = input.type === 'password' ? 'text' : 'password';
    icon.className = input.type === 'password' ? 'fa-solid fa-eye' : 'fa-solid fa-eye-slash';
}
</script>
</body>
</html>
