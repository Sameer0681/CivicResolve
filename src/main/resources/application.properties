
# =========================================================
# CIVICRESOLVE - APPLICATION CONFIGURATION
# =========================================================
spring.application.name=civicresolve
 
# =========================================================
# SERVER
# =========================================================

server.port=8080


# =========================================================
# MYSQL DATABASE
# =========================================================

spring.datasource.url=jdbc:mysql://localhost:3306/civicresolve
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# =========================================================
# JPA / HIBERNATE
# =========================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false


# =========================================================
# FILE UPLOAD
# =========================================================

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB


# =========================================================
# THYMELEAF
# =========================================================

spring.thymeleaf.cache=false


# =========================================================
# ACTUATOR
# =========================================================

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized


# =========================================================
# CIVICRESOLVE APPLICATION SETTINGS
# =========================================================

civicresolve.complaint.id-prefix=CR
civicresolve.complaint.default-response-time-hours=48

# =========================================================
# AI CLASSIFICATION ENGINE
# =========================================================
civicresolve.ai.provider.enabled=${CIVICRESOLVE_AI_ENABLED:false}
civicresolve.ai.provider.api-url=${CIVICRESOLVE_AI_API_URL:https://api.openai.com/v1/chat/completions}
civicresolve.ai.provider.api-key=${CIVICRESOLVE_AI_API_KEY:}
civicresolve.ai.provider.model=${CIVICRESOLVE_AI_MODEL:gpt-4o-mini}
civicresolve.ai.provider.timeout-ms=${CIVICRESOLVE_AI_TIMEOUT_MS:5000}
# =========================================================
# SLA POLICY SETTINGS
# =========================================================
civicresolve.sla.low-days=7
civicresolve.sla.medium-days=5
civicresolve.sla.high-days=2
civicresolve.sla.critical-hours=24

# =========================================================
# ESCALATION SCHEDULER
# =========================================================
civicresolve.escalation.scheduler.enabled=true
civicresolve.escalation.scheduler.fixed-delay-ms=300000


# =========================================================
# LOGGING
# =========================================================

logging.level.com.civicresolve=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO