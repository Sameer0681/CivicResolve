<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Notifications')}">
    <link th:href="@{/css/citizen.css}" rel="stylesheet"/>
</head>
<body>
<div class="cr-dashboard-layout">
    <th:block th:replace="~{fragments/citizen-sidebar :: citizen-sidebar}"/>
    <div class="cr-dashboard-main">
        <div class="cr-topbar">
            <div class="d-flex align-items-center gap-2">
                <button class="btn btn-sm btn-light d-lg-none" onclick="document.querySelector('.cr-sidebar').classList.toggle('show');document.querySelector('.cr-sidebar-backdrop')?.classList.toggle('show')"><i class="fa-solid fa-bars"></i></button>
                <h1 class="cr-topbar-title">Notifications</h1>
            </div>
            <button class="btn btn-sm btn-outline-secondary">Mark all as read</button>
        </div>
        <div class="cr-page-content">
            <div class="cr-card">
                <div class="cr-card-header">
                    <h6 class="fw-700 mb-0">All Notifications</h6>
                </div>
                <div class="p-4 text-center text-muted">
                    <i class="fa-regular fa-bell-slash fa-2x mb-2"></i>
                    <p class="mb-0">No notifications to display.</p>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
