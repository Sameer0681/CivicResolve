<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Escalations')}">
    <link th:href="@{/css/admin.css}" rel="stylesheet"/>
</head>
<body>
<div class="cr-dashboard-layout">
    <th:block th:replace="~{fragments/admin-sidebar :: admin-sidebar}"/>
    <div class="cr-dashboard-main">
        <div class="cr-topbar"><h1 class="cr-topbar-title">Escalations</h1></div>
        <div class="cr-page-content">
            <th:block th:replace="~{fragments/alerts :: alerts}"/>
            <div class="cr-card" th:if="${!#lists.isEmpty(escalations)}">
                <div class="table-responsive">
                    <table class="cr-table">
                        <thead><tr><th>Complaint</th><th>Department</th><th>Assigned officer</th><th>Priority</th><th>Status</th><th>Reason</th><th>Created</th></tr></thead>
                        <tbody>
                        <tr th:each="escalation : ${escalations}">
                            <td>
                                <span class="font-monospace d-block" th:text="${escalation.complaint.complaintId}">CR-000</span>
                                <span class="small" th:text="${escalation.complaint.title}">Complaint title</span>
                            </td>
                            <td th:text="${escalation.complaint.department}">Department</td>
                            <td th:text="${escalation.assignedOfficer != null ? escalation.assignedOfficer.fullName : 'Unassigned'}">Officer</td>
                            <td th:text="${escalation.priorityLevel}">HIGH</td>
                            <td><span class="badge"
                                      th:classappend="${escalation.status == 'RESOLVED' ? ' bg-success-subtle text-success' : ' bg-warning-subtle text-warning'}"
                                      th:text="${escalation.status}">PENDING</span></td>
                            <td th:text="${escalation.reason}">Reason</td>
                            <td th:text="${escalation.createdAt}">Date</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="cr-card p-4 text-center text-muted" th:if="${#lists.isEmpty(escalations)}">
                <i class="fa-solid fa-triangle-exclamation fa-2x mb-2"></i>
                <p class="mb-0">There are no complaint escalations.</p>
            </div>
        </div>
    </div>
</div>
</body>
</html>
