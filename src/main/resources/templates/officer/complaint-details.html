<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Complaint Details')}">
    <link th:href="@{/css/officer.css}" rel="stylesheet"/>
</head>
<body>
<div class="cr-dashboard-layout">
    <th:block th:replace="~{fragments/officer-sidebar :: officer-sidebar}"/>
    <div class="cr-dashboard-main">
        <div class="cr-topbar">
            <div class="d-flex align-items-center gap-2">
                <button class="btn btn-sm btn-light d-lg-none" onclick="document.querySelector('.cr-sidebar').classList.toggle('show');document.querySelector('.cr-sidebar-backdrop')?.classList.toggle('show')">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <a th:href="@{/officer/complaints}" class="btn btn-sm btn-light">
                    <i class="fa-solid fa-arrow-left"></i>
                </a>
                <h1 class="cr-topbar-title">Complaint Details</h1>
            </div>
        </div>
        <main class="cr-page-content">
            <div class="cr-card">
                <div class="cr-card-body text-center py-5">
                    <i class="fa-solid fa-clipboard-list text-muted fa-2x mb-3"></i>
                    <h2 class="h5 fw-700">No complaint record selected</h2>
                    <p class="text-muted mb-3">A complaint record must be loaded before its status or assignment can be displayed.</p>
                    <a th:href="@{/officer/complaints}" class="btn btn-outline-primary">Back to complaints</a>
                </div>
            </div>
        </main>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
