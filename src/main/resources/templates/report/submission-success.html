<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Complaint Submitted — CivicResolve')}">
    <link th:href="@{/css/report.css}" rel="stylesheet"/>
</head>
<body class="bg-light" style="min-height: 100vh; display: flex; flex-direction: column;">

<th:block th:replace="~{fragments/navbar :: navbar}"/>

<main class="py-5 flex-grow-1 d-flex align-items-center">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-7 col-md-9">
                <div class="card border shadow-sm rounded-4 bg-white overflow-hidden" id="receiptPrintArea">
                    <div class="card-header bg-white border-bottom p-3 d-flex align-items-center gap-2">
                        <i class="fa-solid fa-circle-check text-success fa-lg"></i>
                        <span class="fw-800 text-dark">Complaint submitted</span>
                    </div>

                    <div class="p-4">
                        <div class="text-center mb-4">
                            <div class="cr-success-icon mb-3">
                                <i class="fa-solid fa-check"></i>
                            </div>
                            <h3 class="fw-900 text-dark mb-1">Your complaint was received</h3>
                            <p class="text-muted small mb-0">Keep this reference ID for your records.</p>
                            <div class="cr-complaint-id my-3" id="displayComplaintId"
                                 th:text="${complaint.complaintId}"></div>
                        </div>

                        <div class="p-3 rounded-3 mb-4 bg-light border" style="font-size: 0.9rem;">
                            <div class="mb-3" th:if="${complaint.title != null and !#strings.isEmpty(complaint.title)}">
                                <span class="text-muted small fw-700">COMPLAINT SUBJECT</span>
                                <div class="text-dark fw-800" id="displayTitle" th:text="${complaint.title}"></div>
                            </div>
                            <div class="row g-3">
                                <div class="col-sm-6" th:if="${complaint.sector != null and !#strings.isEmpty(complaint.sector)}">
                                    <span class="text-muted small fw-700">SECTOR</span>
                                    <div class="text-dark fw-700" id="displaySector" th:text="${complaint.sector}"></div>
                                </div>
                                <div class="col-sm-6" th:if="${complaint.department != null and !#strings.isEmpty(complaint.department)}">
                                    <span class="text-muted small fw-700">DEPARTMENT</span>
                                    <div class="text-dark fw-700" id="displayDept" th:text="${complaint.department}"></div>
                                </div>
                                <div class="col-12" th:if="${complaint.location != null and !#strings.isEmpty(complaint.location)}">
                                    <span class="text-muted small fw-700">LOCATION</span>
                                    <div class="text-dark fw-600" id="displayLocation" th:text="${complaint.location}"></div>
                                </div>
                                <div class="col-12" th:if="${complaint.description != null and !#strings.isEmpty(complaint.description)}">
                                    <span class="text-muted small fw-700">DESCRIPTION</span>
                                    <div class="text-dark" th:text="${complaint.description}"></div>
                                </div>
                                <div class="col-sm-6" th:if="${complaint.urgency != null and !#strings.isEmpty(complaint.urgency)}">
                                    <span class="text-muted small fw-700">PRIORITY</span>
                                    <div class="text-dark fw-700" id="displayUrgency" th:text="${complaint.urgency}"></div>
                                </div>
                            </div>
                        </div>

                        <div class="d-flex flex-column gap-2">
                            <div class="d-flex gap-2">
                                <a th:href="@{/report}" class="btn btn-outline-secondary fw-600 py-2 flex-grow-1">
                                    <i class="fa-solid fa-plus me-1"></i> File Another Complaint
                                </a>
                                <a th:href="@{/track(id=${complaint.complaintId})}"
                                   class="btn btn-primary fw-600 py-2 flex-grow-1">
                                    <i class="fa-solid fa-magnifying-glass me-1"></i> Track complaint
                                </a>
                            </div>
                            <a th:href="@{/}" class="btn btn-link text-muted text-decoration-none small text-center mt-1">
                                &larr; Return to Home
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<th:block th:replace="~{fragments/footer :: footer}"/>
</body>
</html>
