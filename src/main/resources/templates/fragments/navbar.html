<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-light cr-navbar sticky-top">
    <div class="container">
        <!-- Brand -->
        <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/}">
            <div class="cr-logo-icon">
                <i class="fa-solid fa-landmark"></i>
            </div>
            <div>
                <span class="cr-brand-text">Civic<span class="cr-brand-accent">Resolve</span></span>
            </div>
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain"
                aria-controls="navbarMain" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarMain">
            <ul class="navbar-nav mx-auto gap-1">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}"><i class="fa-solid fa-house me-1"></i> Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/report}"><i class="fa-solid fa-plus-circle me-1"></i> Report an Issue</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/track}"><i class="fa-solid fa-location-crosshairs me-1"></i> Track Complaint</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/sectors}"><i class="fa-solid fa-building-columns me-1"></i> 14 Sectors</a>
                </li>
            </ul>

            <div class="d-flex align-items-center gap-2">
                <a th:href="@{/report}" class="btn btn-primary btn-sm px-3 fw-600">
                    <i class="fa-solid fa-file-pen me-1"></i> File Grievance
                </a>

                <!-- Anonymous Visitor -->
                <th:block sec:authorize="isAnonymous()">
                    <a th:href="@{/login}" class="btn btn-outline-primary btn-sm px-3">Sign In</a>
                    <a th:href="@{/register}" class="btn btn-secondary btn-sm px-3 d-none d-sm-inline-block">Register</a>
                </th:block>

                <!-- Authenticated User -->
                <th:block sec:authorize="isAuthenticated()">
                    <!-- Admin Link -->
                    <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/dashboard}" class="btn btn-outline-primary btn-sm px-3">
                        <i class="fa-solid fa-gauge me-1"></i> Admin Panel
                    </a>
                    <!-- Officer Link -->
                    <a sec:authorize="hasRole('OFFICER')" th:href="@{/officer/dashboard}" class="btn btn-outline-primary btn-sm px-3">
                        <i class="fa-solid fa-user-shield me-1"></i> Officer Desk
                    </a>
                    <!-- Citizen Link -->
                    <a sec:authorize="hasRole('CITIZEN')" th:href="@{/citizen/dashboard}" class="btn btn-outline-primary btn-sm px-3">
                        <i class="fa-solid fa-user me-1"></i> My Dashboard
                    </a>

                    <!-- Signed-in user name and role -->
                    <span class="cr-navbar-user">
                        <i class="fa-solid fa-circle-user cr-navbar-user-icon" aria-hidden="true"></i>
                        <span class="cr-navbar-user-details">
                            <span class="cr-navbar-user-name"
                                  th:text="${#authentication.principal.fullName}">User Name</span>
                            <span class="cr-navbar-user-role" sec:authorize="hasRole('CITIZEN')">Citizen</span>
                            <span class="cr-navbar-user-role" sec:authorize="hasRole('OFFICER')">Officer</span>
                            <span class="cr-navbar-user-role" sec:authorize="hasRole('ADMIN')">Administrator</span>
                        </span>
                    </span>

                    <!-- Logout Button -->
                    <form th:action="@{/logout}" method="post" class="d-inline m-0">
                        <button type="submit" class="btn btn-outline-danger btn-sm px-2.5" title="Sign Out">
                            <i class="fa-solid fa-right-from-bracket"></i>
                        </button>
                    </form>
                </th:block>
            </div>
        </div>
    </div>
</nav>
</body>
</html>
