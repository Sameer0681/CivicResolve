<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - CivicResolve</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link th:href="@{/css/common.css}" rel="stylesheet">
    <link th:href="@{/css/auth.css}" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
        <a th:href="@{/}" class="d-flex align-items-center gap-2 text-decoration-none mb-4">
            <div class="cr-logo-icon"><i class="fa-solid fa-landmark"></i></div>
            <span class="cr-brand-text">Civic<span class="cr-brand-accent">Resolve</span></span>
        </a>

        <div class="mb-4">
            <div style="width:56px;height:56px;background:var(--cr-primary-light);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.4rem;color:var(--cr-primary);margin-bottom:1rem;">
                <i class="fa-solid fa-lock-open"></i>
            </div>
            <h1 class="cr-auth-title">Set new password</h1>
            <p class="cr-auth-subtitle">Enter the 6-digit OTP code sent to your email along with your new password.</p>
        </div>

        <!-- Server Alerts -->
        <div th:if="${errorMsg}" class="alert alert-danger cr-alert py-2 mb-3">
            <i class="fa-solid fa-circle-exclamation me-2"></i><span th:text="${errorMsg}"></span>
        </div>
        <div th:if="${successMsg}" class="alert alert-success cr-alert py-2 mb-3">
            <i class="fa-solid fa-circle-check me-2"></i><span th:text="${successMsg}"></span>
        </div>

        <!-- Plain Server-Side Form (No JavaScript) -->
        <form th:action="@{/reset-password}" method="post">
            <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}"/>

            <!-- Email Field -->
            <div class="mb-3">
                <label class="cr-form-label">Email Address <span class="text-danger">*</span></label>
                <div class="cr-input-icon-wrap">
                    <i class="cr-input-icon fa-solid fa-envelope"></i>
                    <input type="email" name="email" class="form-control" placeholder="you@example.com"
                           th:value="${email}" required>
                </div>
            </div>

            <!-- OTP Field -->
            <div class="mb-3">
                <div class="d-flex justify-content-between align-items-center">
                    <label class="cr-form-label mb-1">6-Digit Verification Code <span class="text-danger">*</span></label>
                    <a th:href="@{/forgot-password}" class="small text-decoration-none fw-600 text-primary">Resend Code</a>
                </div>
                <div class="cr-input-icon-wrap">
                    <i class="cr-input-icon fa-solid fa-key"></i>
                    <input type="text" name="otp" class="form-control fw-bold" placeholder="000000"
                           th:value="${otp}" maxlength="6" pattern="[0-9]{6}" required autofocus autocomplete="off">
                </div>
            </div>

            <!-- New Password Field -->
            <div class="mb-3">
                <label class="cr-form-label">New Password <span class="text-danger">*</span></label>
                <div class="cr-input-icon-wrap">
                    <i class="cr-input-icon fa-solid fa-lock"></i>
                    <input type="password" name="password" class="form-control" placeholder="Min. 8 characters" required minlength="8">
                </div>
            </div>

            <!-- Confirm Password Field -->
            <div class="mb-4">
                <label class="cr-form-label">Confirm New Password <span class="text-danger">*</span></label>
                <div class="cr-input-icon-wrap">
                    <i class="cr-input-icon fa-solid fa-lock"></i>
                    <input type="password" name="confirmPassword" class="form-control" placeholder="Repeat password" required minlength="8">
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-600">
                <i class="fa-solid fa-check me-2"></i>Reset & Update Password
            </button>
        </form>

        <p class="text-center text-muted small mt-4 mb-0">
            Remembered your password?
            <a th:href="@{/login}" class="fw-600 text-decoration-none">Back to login</a>
        </p>
    </div>

    <div class="cr-auth-visual">
        <div class="cr-auth-visual-content">
            <div class="cr-auth-visual-icon"><i class="fa-solid fa-shield-halved"></i></div>
            <h2>Secure your account</h2>
            <p>Your password is encrypted with standard BCrypt password encryption.</p>
        </div>
    </div>
</div>
</body>
</html>
