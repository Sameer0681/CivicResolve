<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Citizen Dashboard')}">
    <link th:href="@{/css/citizen.css}" rel="stylesheet"/>
</head>
<body>
<div class="cr-dashboard-layout">
    <th:block th:replace="~{fragments/citizen-sidebar :: citizen-sidebar}"/>
    <div class="cr-dashboard-main">
        <div class="cr-topbar">
            <h1 class="cr-topbar-title">Dashboard</h1>
            <div class="d-flex align-items-center gap-3">
                <a th:href="@{/report}" class="btn btn-primary btn-sm fw-600">
                    <i class="fa-solid fa-plus me-1"></i>New Report
                </a>
                <a th:href="@{/citizen/notifications}" class="text-muted">
                    <i class="fa-solid fa-bell fa-lg"></i>
                </a>
            </div>
        </div>
        <div class="cr-page-content">
            <th:block th:replace="~{fragments/alerts :: alerts}"/>
            <div class="mb-4">
                <h4 class="fw-700 mb-1">Your civic reports</h4>
                <p class="text-muted small mb-0">Your submitted reports will appear here.</p>
            </div>
            <div class="cr-complaint-list" th:if="${!#lists.isEmpty(complaints)}">
                <article class="cr-complaint-card cr-complaint-card--dashboard"
                         th:each="complaint, iter : ${complaints}" th:if="${iter.index < 5}">
                    <div class="cr-complaint-card-main">
                        <div class="d-flex flex-wrap align-items-center gap-2 mb-2">
                            <span class="cr-complaint-id-tag" th:text="${complaint.complaintId}">CR-000</span>
                            <span class="cr-status"
                                  th:classappend="${' cr-status--' + #strings.toLowerCase(complaint.status.name())}"
                                  th:text="${#strings.replace(complaint.status.name(), '_', ' ')}">SUBMITTED</span>
                        </div>
                        <h3 class="h6 fw-700 mb-1" th:text="${complaint.title}">Complaint title</h3>
                        <span class="text-muted small" th:text="${complaint.sector}">Sector</span>
                    </div>
                    <a class="btn btn-outline-primary btn-sm cr-complaint-track-link"
                       th:href="@{/citizen/complaint-details(id=${complaint.id})}">Details</a>
                </article>
                <div class="text-end mt-3" th:if="${#lists.size(complaints) > 5}">
                    <a th:href="@{/citizen/complaints}" class="btn btn-outline-primary btn-sm">
                        View all complaints <i class="fa-solid fa-arrow-right ms-1"></i>
                    </a>
                </div>
            </div>
            <div class="cr-card p-5 text-center" th:if="${#lists.isEmpty(complaints)}">
                <div class="cr-empty-state-icon mb-3"><i class="fa-regular fa-folder-open"></i></div>
                <h2 class="h5 fw-700 mb-2">No reports to display</h2>
                <p class="text-muted mb-4">Your submitted civic reports will appear here.</p>
                <a th:href="@{/report}" class="btn btn-primary">
                    <i class="fa-solid fa-plus me-1"></i>Submit a report
                </a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
