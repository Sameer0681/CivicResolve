
# =========================================================
# CIVICRESOLVE - APPLICATION CONFIGURATION
# =========================================================
spring.application.name=civicresolve
 
# =========================================================
# SERVER
# =========================================================

server.port=8080


# =========================================================
# MYSQL DATABASE
# =========================================================

spring.datasource.url=jdbc:mysql://localhost:3306/civicresolve
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# =========================================================
# JPA / HIBERNATE
# =========================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false


# =========================================================
# FILE UPLOAD
# =========================================================

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB


# =========================================================
# THYMELEAF
# =========================================================

spring.thymeleaf.cache=false


# =========================================================
# ACTUATOR
# =========================================================

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized


# =========================================================
# CIVICRESOLVE APPLICATION SETTINGS
# =========================================================

civicresolve.complaint.id-prefix=CR
civicresolve.complaint.default-response-time-hours=48


# =========================================================
# LOGGING
# =========================================================

logging.level.com.civicresolve=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO


logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.authentication=TRACE


# =========================================================
# OTP VERIFICATION SETTINGS
# =========================================================
app.otp.required=false
app.otp.provider=mock
app.otp.default-channel=BOTH

# Twilio configuration (activated when app.otp.provider=twilio)
twilio.account-sid=${TWILIO_ACCOUNT_SID:ACmock_account_sid}
twilio.auth-token=${TWILIO_AUTH_TOKEN:mock_auth_token}
twilio.phone-number=${TWILIO_PHONE_NUMBER:+12025550199}

# Dedicated demo logger for OTP verification
logging.level.otp.demo=INFO

# =========================================================
# GEMINI AI CLASSIFICATION SETTINGS
# =========================================================
civicresolve.ai.enabled=${CIVICRESOLVE_AI_ENABLED:true}
civicresolve.ai.gemini.api-key=${GEMINI_API_KEY:}
civicresolve.ai.gemini.model=${GEMINI_MODEL:gemini-3.6-flash}
civicresolve.ai.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
civicresolve.ai.gemini.connect-timeout-ms=${GEMINI_CONNECT_TIMEOUT_MS:3000}
civicresolve.ai.gemini.read-timeout-ms=${GEMINI_READ_TIMEOUT_MS:30000}
civicresolve.ai.gemini.max-retries=${GEMINI_MAX_RETRIES:2}
civicresolve.ai.gemini.initial-backoff-ms=${GEMINI_INITIAL_BACKOFF_MS:250}
