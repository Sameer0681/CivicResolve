<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="alerts">
    <div th:if="${successMsg}" class="alert alert-success cr-alert" role="alert">
        <i class="fa-solid fa-circle-check me-2"></i>
        <span th:text="${successMsg}"></span>
    </div>
    <div th:if="${errorMsg}" class="alert alert-danger cr-alert" role="alert">
        <i class="fa-solid fa-circle-exclamation me-2"></i>
        <span th:text="${errorMsg}"></span>
    </div>
    <div th:if="${infoMsg}" class="alert alert-info cr-alert" role="alert">
        <i class="fa-solid fa-circle-info me-2"></i>
        <span th:text="${infoMsg}"></span>
    </div>
    <div th:if="${warnMsg}" class="alert alert-warning cr-alert" role="alert">
        <i class="fa-solid fa-triangle-exclamation me-2"></i>
        <span th:text="${warnMsg}"></span>
    </div>
</div>
</body>
</html>
