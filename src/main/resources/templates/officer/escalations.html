<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Escalations')}">
    <link th:href="@{/css/officer.css}" rel="stylesheet"/>
</head>
<body>
<div class="cr-dashboard-layout">
    <th:block th:replace="~{fragments/officer-sidebar :: officer-sidebar}"/>
    <div class="cr-dashboard-main">
        <div class="cr-topbar"><h1 class="cr-topbar-title">Escalations</h1></div>
        <div class="cr-page-content">
            <th:block th:replace="~{fragments/alerts :: alerts}"/>
            <div class="cr-complaint-list" th:if="${!#lists.isEmpty(escalations)}">
                <article class="cr-complaint-card" th:each="escalation : ${escalations}">
                    <div class="cr-complaint-card-main">
                        <div class="d-flex flex-wrap align-items-center gap-2 mb-2">
                            <span class="cr-complaint-id-tag" th:text="${escalation.complaint.complaintId}">CR-000</span>
                            <span class="badge"
                                  th:classappend="${escalation.status == 'RESOLVED' ? ' bg-success-subtle text-success' : ' bg-warning-subtle text-warning'}"
                                  th:text="${escalation.status}">PENDING</span>
                        </div>
                        <h2 class="h6 fw-700 mb-1" th:text="${escalation.complaint.title}">Complaint</h2>
                        <p class="text-muted small mb-2" th:text="${escalation.reason}">Reason</p>
                        <div class="cr-complaint-meta">
                            <span th:text="${escalation.complaint.department}">Department</span>
                            <span th:text="${escalation.createdAt}">Date</span>
                        </div>
                    </div>
                    <a class="btn btn-outline-primary btn-sm cr-complaint-track-link"
                       th:href="@{/officer/complaint-details(id=${escalation.complaint.id})}">Open complaint</a>
                </article>
            </div>
            <div class="cr-card p-4 text-center text-muted" th:if="${#lists.isEmpty(escalations)}">
                <i class="fa-solid fa-triangle-exclamation fa-2x mb-2"></i>
                <p class="mb-0">No escalations are assigned to you.</p>
            </div>
        </div>
    </div>
</div>
</body>
</html>
