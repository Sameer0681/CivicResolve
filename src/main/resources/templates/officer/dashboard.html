<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Officer Dashboard')}">
    <link th:href="@{/css/officer.css}" rel="stylesheet"/>
</head>
<body>
<div class="cr-dashboard-layout">
    <th:block th:replace="~{fragments/officer-sidebar :: officer-sidebar}"/>
    <div class="cr-dashboard-main">
        <div class="cr-topbar">
            <h1 class="cr-topbar-title">Officer Dashboard</h1>
            <a th:href="@{/officer/notifications}" class="text-muted"><i class="fa-solid fa-bell fa-lg"></i></a>
        </div>
        <div class="cr-page-content">
            <th:block th:replace="~{fragments/alerts :: alerts}"/>
            <div class="mb-4">
                <h4 class="fw-700 mb-1">Assigned complaints</h4>
                <p class="text-muted small mb-0">Your current workload and recent complaint updates.</p>
            </div>
            <div class="row g-3 mb-4">
                <div class="col-6 col-xl-4">
                    <div class="cr-stat-card">
                        <div class="cr-stat-icon cr-stat-icon--blue"><i class="fa-solid fa-clipboard-list"></i></div>
                        <div><div class="cr-stat-value" th:text="${totalComplaints}">0</div><div class="cr-stat-label">Visible complaints</div></div>
                    </div>
                </div>
                <div class="col-6 col-xl-4">
                    <div class="cr-stat-card">
                        <div class="cr-stat-icon cr-stat-icon--orange"><i class="fa-solid fa-hourglass-half"></i></div>
                        <div><div class="cr-stat-value" th:text="${openComplaints}">0</div><div class="cr-stat-label">Open</div></div>
                    </div>
                </div>
                <div class="col-6 col-xl-4">
                    <div class="cr-stat-card">
                        <div class="cr-stat-icon cr-stat-icon--green"><i class="fa-solid fa-circle-check"></i></div>
                        <div><div class="cr-stat-value" th:text="${resolvedComplaints}">0</div><div class="cr-stat-label">Resolved</div></div>
                    </div>
                </div>
            </div>
            <div class="cr-complaint-list" th:if="${!#lists.isEmpty(complaints)}">
                <article class="cr-complaint-card" th:each="complaint : ${complaints}">
                    <div class="cr-complaint-card-main">
                        <div class="d-flex flex-wrap align-items-center gap-2 mb-2">
                            <span class="cr-complaint-id-tag" th:text="${complaint.complaintId}">CR-000</span>
                            <span class="cr-status"
                                  th:classappend="${' cr-status--' + #strings.toLowerCase(complaint.status.name())}"
                                  th:text="${#strings.replace(complaint.status.name(), '_', ' ')}">SUBMITTED</span>
                        </div>
                        <h3 class="h6 fw-700 mb-1" th:text="${complaint.title}">Complaint title</h3>
                        <span class="text-muted small" th:text="${complaint.sector}">Sector</span>
                    </div>
                    <a class="btn btn-outline-primary btn-sm cr-complaint-track-link"
                       th:href="@{/officer/complaint-details(id=${complaint.id})}">Review</a>
                </article>
                <div class="text-end mt-3" th:if="${totalComplaints > 5}">
                    <a th:href="@{/officer/complaints}" class="btn btn-outline-primary btn-sm">View all complaints</a>
                </div>
            </div>
            <div class="cr-card p-4 text-center text-muted" th:if="${totalComplaints == 0}">
                <i class="fa-regular fa-folder-open fa-2x mb-2"></i>
                <p class="mb-0">No complaints are assigned to you or your department.</p>
            </div>
        </div>
    </div>
</div>
</body>
</html>
