<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Notifications')}">
    <link th:href="@{/css/officer.css}" rel="stylesheet"/>
</head>
<body>
<div class="cr-dashboard-layout">
    <th:block th:replace="~{fragments/officer-sidebar :: officer-sidebar}"/>
    <div class="cr-dashboard-main">
        <div class="cr-topbar">
            <div class="d-flex align-items-center gap-2">
                <h1 class="cr-topbar-title">Notifications</h1>
            </div>
        </div>
        <div class="cr-page-content">
            <div class="cr-card">
                <div class="cr-card-header">
                    <h6 class="fw-700 mb-0">Complaint activity</h6>
                </div>
                <div class="p-4" th:if="${!#lists.isEmpty(activityComplaints)}">
                    <article class="cr-complaint-card" th:each="complaint : ${activityComplaints}">
                        <div class="cr-complaint-card-main">
                            <div class="d-flex flex-wrap align-items-center gap-2 mb-2">
                                <span class="cr-complaint-id-tag" th:text="${complaint.complaintId}">CR-000</span>
                                <span class="cr-status"
                                      th:classappend="${' cr-status--' + #strings.toLowerCase(complaint.status.name())}"
                                      th:text="${#strings.replace(complaint.status.name(), '_', ' ')}">SUBMITTED</span>
                            </div>
                            <h2 class="h6 fw-700 mb-1" th:text="${complaint.title}">Complaint title</h2>
                            <p class="text-muted small mb-0">
                                Last updated <span th:text="${complaint.updatedAt ?: complaint.createdAt}">Date</span>
                            </p>
                        </div>
                        <a class="btn btn-outline-primary btn-sm cr-complaint-track-link"
                           th:href="@{/officer/complaint-details(id=${complaint.id})}">Open complaint</a>
                    </article>
                </div>
                <div class="p-4 text-center text-muted" th:if="${#lists.isEmpty(activityComplaints)}">
                    <i class="fa-regular fa-bell-slash fa-2x mb-2"></i>
                    <p class="mb-0">Complaint updates will appear here.</p>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
