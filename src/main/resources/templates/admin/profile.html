<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Admin Profile')}">
    <link th:href="@{/css/admin.css}" rel="stylesheet"/>
</head>
<body>
<div class="cr-dashboard-layout">
    <th:block th:replace="~{fragments/admin-sidebar :: admin-sidebar}"/>
    <div class="cr-dashboard-main">
        <div class="cr-topbar">
            <div class="d-flex align-items-center gap-2">
                <button class="btn btn-sm btn-light d-lg-none" onclick="document.querySelector('.cr-sidebar').classList.toggle('show');document.querySelector('.cr-sidebar-backdrop')?.classList.toggle('show')"><i class="fa-solid fa-bars"></i></button>
                <h1 class="cr-topbar-title">Admin Profile</h1>
            </div>
        </div>
        <div class="cr-page-content">
            <th:block th:replace="~{fragments/alerts :: alerts}"/>
            <div class="row g-4">
                <div class="col-lg-4">
                    <div class="cr-card text-center">
                        <div class="cr-card-body">
                            <div class="cr-avatar cr-avatar--lg cr-avatar--admin mx-auto mb-3" style="width:80px;height:80px;font-size:2rem;">
                                <i class="fa-solid fa-user-tie"></i>
                            </div>
                            <h5 class="fw-700 mb-1" th:text="${user?.fullName}"></h5>
                            <p class="text-muted small mb-2" th:text="${user?.email}"></p>
                            <span class="cr-badge cr-badge--admin">Administrator</span>
                        </div>
                    </div>

                </div>

                <div class="col-lg-8">
                    <div class="cr-card">
                        <div class="cr-card-header">
                            <h6 class="fw-700 mb-0">Account Information</h6>
                        </div>
                        <div class="cr-card-body">
                            <form th:action="@{/admin/profile}" method="post">
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label class="cr-form-label">First Name</label>
                                        <input type="text" name="firstName" class="form-control" th:value="${user?.firstName}"/>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="cr-form-label">Last Name</label>
                                        <input type="text" name="lastName" class="form-control" th:value="${user?.lastName}"/>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="cr-form-label">Email</label>
                                        <input type="email" name="email" class="form-control" th:value="${user?.email}"/>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="cr-form-label">Phone</label>
                                        <input type="tel" name="phone" class="form-control" th:value="${user?.phone}"/>
                                    </div>
                                    <div class="col-12 d-flex justify-content-end gap-2">
                                        <button type="reset" class="btn btn-light">Cancel</button>
                                        <button type="submit" class="btn btn-primary fw-600">Save Changes</button>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>

                    <div class="cr-card mt-4">
                        <div class="cr-card-header">
                            <h6 class="fw-700 mb-0">Change Password</h6>
                        </div>
                        <div class="cr-card-body">
                            <form th:action="@{/admin/change-password}" method="post">
                                <div class="row g-3">
                                    <div class="col-md-4">
                                        <label class="cr-form-label">Current Password</label>
                                        <input type="password" name="currentPassword" class="form-control"/>
                                    </div>
                                    <div class="col-md-4">
                                        <label class="cr-form-label">New Password</label>
                                        <input type="password" name="newPassword" class="form-control"/>
                                    </div>
                                    <div class="col-md-4">
                                        <label class="cr-form-label">Confirm Password</label>
                                        <input type="password" name="confirmPassword" class="form-control"/>
                                    </div>
                                    <div class="col-12 d-flex justify-content-end">
                                        <button type="submit" class="btn btn-primary fw-600">Update Password</button>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>

                    <!-- System Settings -->
                    <div class="cr-card mt-4">
                        <div class="cr-card-header">
                            <h6 class="fw-700 mb-0">System Settings</h6>
                        </div>
                        <div class="cr-card-body">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="cr-form-label">Default SLA (hours)</label>
                                    <input type="number" class="form-control" value="48"/>
                                </div>
                                <div class="col-md-6">
                                    <label class="cr-form-label">Auto-escalation After (hours)</label>
                                    <input type="number" class="form-control" value="48"/>
                                </div>
                                <div class="col-12">
                                    <div class="form-check form-switch">
                                        <input class="form-check-input" type="checkbox" id="emailNotif" checked/>
                                        <label class="form-check-label fw-600 small" for="emailNotif">Enable email notifications</label>
                                    </div>
                                </div>
                                <div class="col-12">
                                    <div class="form-check form-switch">
                                        <input class="form-check-input" type="checkbox" id="autoEscalate" checked/>
                                        <label class="form-check-label fw-600 small" for="autoEscalate">Enable auto-escalation</label>
                                    </div>
                                </div>
                                <div class="col-12 d-flex justify-content-end">
                                    <button class="btn btn-primary fw-600">Save Settings</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
