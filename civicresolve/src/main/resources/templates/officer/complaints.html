<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Assigned Complaints')}">
    <link th:href="@{/css/officer.css}" rel="stylesheet"/>
</head>
<body>
<div class="cr-dashboard-layout">
    <th:block th:replace="~{fragments/officer-sidebar :: officer-sidebar}"/>
    <div class="cr-dashboard-main">
        <div class="cr-topbar">
            <div class="d-flex align-items-center gap-2">
                <button class="btn btn-sm btn-light d-lg-none" onclick="document.querySelector('.cr-sidebar').classList.toggle('show')"><i class="fa-solid fa-bars"></i></button>
                <h1 class="cr-topbar-title">Assigned Complaints</h1>
            </div>
        </div>
        <div class="cr-page-content">
            <!-- Filters -->
            <div class="cr-card mb-4">
                <div class="cr-card-body">
                    <div class="row g-3 align-items-end">
                        <div class="col-md-4">
                            <label class="cr-form-label">Search</label>
                            <div class="cr-input-icon-wrap">
                                <i class="cr-input-icon fa-solid fa-search"></i>
                                <input type="text" class="form-control" placeholder="Search complaints..."/>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <label class="cr-form-label">Status</label>
                            <select class="form-select">
                                <option>All Statuses</option>
                                <option>Open</option>
                                <option>In Progress</option>
                                <option>Resolved</option>
                                <option>Escalated</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="cr-form-label">Priority</label>
                            <select class="form-select">
                                <option>All Priorities</option>
                                <option>High</option>
                                <option>Medium</option>
                                <option>Low</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <button class="btn btn-primary w-100">Filter</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="cr-card">
                <div class="table-responsive">
                    <table class="cr-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Title</th>
                                <th>Category</th>
                                <th>Citizen</th>
                                <th>Priority</th>
                                <th>Status</th>
                                <th>SLA</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td><span class="cr-complaint-id-tag">CR-2025-001</span></td>
                                <td>Pothole on MG Road</td>
                                <td><span class="badge bg-light text-dark">Roads</span></td>
                                <td class="text-muted small">John D.</td>
                                <td><span class="cr-status cr-status--escalated">High</span></td>
                                <td><span class="cr-status cr-status--inprogress">In Progress</span></td>
                                <td><span class="text-warning small fw-600">6h left</span></td>
                                <td><a th:href="@{/officer/complaint-details}" class="btn btn-sm btn-primary">Manage</a></td>
                            </tr>
                            <tr>
                                <td><span class="cr-complaint-id-tag">CR-2025-005</span></td>
                                <td>Water pipe burst</td>
                                <td><span class="badge bg-light text-dark">Water</span></td>
                                <td class="text-muted small">Priya S.</td>
                                <td><span class="cr-status cr-status--escalated">High</span></td>
                                <td><span class="cr-status cr-status--escalated">Escalated</span></td>
                                <td><span class="text-danger small fw-600">Overdue</span></td>
                                <td><a th:href="@{/officer/complaint-details}" class="btn btn-sm btn-danger">Urgent</a></td>
                            </tr>
                            <tr>
                                <td><span class="cr-complaint-id-tag">CR-2025-006</span></td>
                                <td>Broken park bench</td>
                                <td><span class="badge bg-light text-dark">Parks</span></td>
                                <td class="text-muted small">Ravi K.</td>
                                <td><span class="cr-status cr-status--pending">Low</span></td>
                                <td><span class="cr-status cr-status--open">Open</span></td>
                                <td><span class="text-success small fw-600">36h left</span></td>
                                <td><a th:href="@{/officer/complaint-details}" class="btn btn-sm btn-primary">Manage</a></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
