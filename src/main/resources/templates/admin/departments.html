<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Departments')}">
    <link th:href="@{/css/admin.css}" rel="stylesheet"/>
</head>
<body>
<div class="cr-dashboard-layout">
    <th:block th:replace="~{fragments/admin-sidebar :: admin-sidebar}"/>
    <div class="cr-dashboard-main">
        <div class="cr-topbar">
            <div class="d-flex align-items-center gap-2">
                <button class="btn btn-sm btn-light d-lg-none" onclick="document.querySelector('.cr-sidebar').classList.toggle('show');document.querySelector('.cr-sidebar-backdrop')?.classList.toggle('show')">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <h1 class="cr-topbar-title">Departments</h1>
            </div>
        </div>
        <main class="cr-page-content">
            <th:block th:replace="~{fragments/alerts :: alerts}"/>
            <div class="cr-card">
                <div class="cr-card-body text-center py-5">
                    <i class="fa-solid fa-building text-muted fa-2x mb-3"></i>
                    <h2 class="h5 fw-700">No department records available</h2>
                    <p class="text-muted mb-0">Department management data has not been configured.</p>
                </div>
            </div>
        </main>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
