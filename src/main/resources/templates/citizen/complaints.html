<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('My Complaints')}">
    <link th:href="@{/css/citizen.css}" rel="stylesheet"/>
</head>
<body>
<div class="cr-dashboard-layout">
    <th:block th:replace="~{fragments/citizen-sidebar :: citizen-sidebar}"/>
    <div class="cr-dashboard-main">
        <div class="cr-topbar">
            <div class="d-flex align-items-center gap-2">
                <button class="btn btn-sm btn-light d-lg-none" onclick="document.querySelector('.cr-sidebar').classList.toggle('show');document.querySelector('.cr-sidebar-backdrop')?.classList.toggle('show')"><i class="fa-solid fa-bars"></i></button>
                <h1 class="cr-topbar-title">My Complaints</h1>
            </div>
            <a th:href="@{/report}" class="btn btn-primary btn-sm fw-600">
                <i class="fa-solid fa-plus me-1"></i>New Report
            </a>
        </div>
        <div class="cr-page-content">
            <th:block th:replace="~{fragments/alerts :: alerts}"/>
            <div class="cr-card p-4 text-center text-muted">
                <i class="fa-regular fa-folder-open fa-2x mb-2"></i>
                <p class="mb-0">No complaints to display.</p>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
