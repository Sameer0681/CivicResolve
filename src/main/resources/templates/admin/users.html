<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Users')}">
    <link th:href="@{/css/admin.css}" rel="stylesheet"/>
</head>
<body>
<div class="cr-dashboard-layout">
    <th:block th:replace="~{fragments/admin-sidebar :: admin-sidebar}"/>
    <div class="cr-dashboard-main">
        <div class="cr-topbar">
            <div class="d-flex align-items-center gap-2">
                <button class="btn btn-sm btn-light d-lg-none" onclick="document.querySelector('.cr-sidebar').classList.toggle('show');document.querySelector('.cr-sidebar-backdrop')?.classList.toggle('show')"><i class="fa-solid fa-bars"></i></button>
                <h1 class="cr-topbar-title">User Management</h1>
            </div>
            <button class="btn btn-primary btn-sm fw-600" data-bs-toggle="modal" data-bs-target="#addUserModal">
                <i class="fa-solid fa-user-plus me-1"></i>Add User
            </button>
        </div>
        <div class="cr-page-content">
            <th:block th:replace="~{fragments/alerts :: alerts}"/>

            <!-- Stats -->
            <div class="row g-3 mb-4">
                <div class="col-6 col-md-4">
                    <div class="cr-stat-card">
                        <div class="cr-stat-icon cr-stat-icon--blue"><i class="fa-solid fa-users"></i></div>
                        <div><div class="cr-stat-value" th:text="${totalUsers}">0</div><div class="cr-stat-label">Total Users</div></div>
                    </div>
                </div>
                <div class="col-6 col-md-4">
                    <div class="cr-stat-card">
                        <div class="cr-stat-icon cr-stat-icon--purple"><i class="fa-solid fa-user-shield"></i></div>
                        <div><div class="cr-stat-value" th:text="${officerCount}">0</div><div class="cr-stat-label">Officers</div></div>
                    </div>
                </div>
                <div class="col-6 col-md-4">
                    <div class="cr-stat-card">
                        <div class="cr-stat-icon cr-stat-icon--orange"><i class="fa-solid fa-user-tie"></i></div>
                        <div><div class="cr-stat-value" th:text="${adminCount}">0</div><div class="cr-stat-label">Admins</div></div>
                    </div>
                </div>
            </div>

            <!-- Filters -->
            <div class="cr-card mb-4">
                <div class="cr-card-body">
                    <div class="row g-3 align-items-end">
                        <div class="col-md-5">
                            <label class="cr-form-label">Search</label>
                            <div class="cr-input-icon-wrap">
                                <i class="cr-input-icon fa-solid fa-search"></i>
                                <input type="text" class="form-control" placeholder="Search by name or email..."/>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <label class="cr-form-label">Role</label>
                            <select class="form-select">
                                <option>All Roles</option>
                                <option>Citizen</option>
                                <option>Officer</option>
                                <option>Admin</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <label class="cr-form-label">Status</label>
                            <select class="form-select">
                                <option>All</option>
                                <option>Active</option>
                                <option>Inactive</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <button class="btn btn-primary w-100">Filter</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Users Table -->
            <div class="cr-card">
                <div class="table-responsive">
                    <table class="cr-table cr-user-row">
                        <thead>
                            <tr>
                                <th>User</th>
                                <th>Email</th>
                                <th>Role</th>
                                <th>Department</th>
                                <th>Joined</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="user : ${users}">
                                <td th:text="${user.fullName}"></td>
                                <td class="text-muted small" th:text="${user.email}"></td>
                                <td th:text="${user.role}"></td>
                                <td class="text-muted small" th:text="${user.department} ?: '—'"></td>
                                <td class="text-muted small" th:text="${user.createdAt}"></td>
                                <td>
                                    <span th:if="${user.enabled}" class="badge bg-success-subtle text-success">Active</span>
                                    <span th:unless="${user.enabled}" class="badge bg-secondary-subtle text-secondary">Inactive</span>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(users)}">
                                <td colspan="6" class="text-center text-muted py-4">No users found.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Add User Modal -->
<div class="modal fade" id="addUserModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content cr-modal">
            <div class="modal-header border-0 pb-0">
                <h5 class="modal-title fw-700">Add New User</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form>
                    <div class="row g-3">
                        <div class="col-6">
                            <label class="cr-form-label">First Name</label>
                            <input type="text" class="form-control" placeholder="First name"/>
                        </div>
                        <div class="col-6">
                            <label class="cr-form-label">Last Name</label>
                            <input type="text" class="form-control" placeholder="Last name"/>
                        </div>
                        <div class="col-12">
                            <label class="cr-form-label">Email</label>
                            <input type="email" class="form-control" placeholder="Email address"/>
                        </div>
                        <div class="col-12">
                            <label class="cr-form-label">Role</label>
                            <select class="form-select">
                                <option>Citizen</option>
                                <option>Officer</option>
                                <option>Admin</option>
                            </select>
                        </div>
                        <div class="col-12">
                            <label class="cr-form-label">Department (for Officers)</label>
                            <select class="form-select">
                                <option>— Select Department —</option>
                                <option>Roads &amp; Infrastructure</option>
                                <option>Water Supply</option>
                                <option>Sanitation</option>
                                <option>Street Lighting</option>
                                <option>Parks &amp; Environment</option>
                            </select>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer border-0 pt-0">
                <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary fw-600">Create User</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
