<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('My Profile')}">
    <link th:href="@{/css/officer.css}" rel="stylesheet"/>
</head>
<body>
<div class="cr-dashboard-layout">
    <th:block th:replace="~{fragments/officer-sidebar :: officer-sidebar}"/>
    <div class="cr-dashboard-main">
        <div class="cr-topbar">
            <div class="d-flex align-items-center gap-2">
                <button class="btn btn-sm btn-light d-lg-none" onclick="document.querySelector('.cr-sidebar').classList.toggle('show')"><i class="fa-solid fa-bars"></i></button>
                <h1 class="cr-topbar-title">My Profile</h1>
            </div>
        </div>
        <div class="cr-page-content">
            <th:block th:replace="~{fragments/alerts :: alerts}"/>
            <div class="row g-4">
                <div class="col-lg-4">
                    <div class="cr-card text-center">
                        <div class="cr-card-body">
                            <div class="cr-avatar cr-avatar--lg cr-avatar--officer mx-auto mb-3" style="width:80px;height:80px;font-size:2rem;">
                                <i class="fa-solid fa-user-shield"></i>
                            </div>
                            <h5 class="fw-700 mb-1">Rajesh Sharma</h5>
                            <p class="text-muted small mb-2">rajesh.sharma@civicresolve.in</p>
                            <span class="cr-badge cr-badge--officer">Officer</span>
                            <hr/>
                            <div class="text-muted small mb-2"><i class="fa-solid fa-building me-2"></i>Roads &amp; Infrastructure</div>
                            <div class="text-muted small"><i class="fa-solid fa-location-dot me-2"></i>Bangalore Zone 2</div>
                            <hr/>
                            <div class="row g-2 text-center">
                                <div class="col-4">
                                    <div class="fw-700">28</div>
                                    <div class="text-muted" style="font-size:.7rem;">Resolved</div>
                                </div>
                                <div class="col-4">
                                    <div class="fw-700">5</div>
                                    <div class="text-muted" style="font-size:.7rem;">Active</div>
                                </div>
                                <div class="col-4">
                                    <div class="fw-700">96%</div>
                                    <div class="text-muted" style="font-size:.7rem;">Rating</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-lg-8">
                    <div class="cr-card">
                        <div class="cr-card-header">
                            <h6 class="fw-700 mb-0">Personal Information</h6>
                        </div>
                        <div class="cr-card-body">
                            <form th:action="@{/officer/profile}" method="post">
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label class="cr-form-label">First Name</label>
                                        <input type="text" name="firstName" class="form-control" value="Rajesh"/>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="cr-form-label">Last Name</label>
                                        <input type="text" name="lastName" class="form-control" value="Sharma"/>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="cr-form-label">Email</label>
                                        <input type="email" name="email" class="form-control" value="rajesh.sharma@civicresolve.in"/>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="cr-form-label">Phone</label>
                                        <input type="tel" name="phone" class="form-control" value="+91 98765 11111"/>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="cr-form-label">Department</label>
                                        <input type="text" class="form-control" value="Roads &amp; Infrastructure" disabled/>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="cr-form-label">Zone</label>
                                        <input type="text" class="form-control" value="Bangalore Zone 2" disabled/>
                                    </div>
                                    <div class="col-12 d-flex justify-content-end gap-2">
                                        <button type="reset" class="btn btn-light">Cancel</button>
                                        <button type="submit" class="btn btn-primary fw-600">Save Changes</button>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>

                    <div class="cr-card mt-4">
                        <div class="cr-card-header">
                            <h6 class="fw-700 mb-0">Change Password</h6>
                        </div>
                        <div class="cr-card-body">
                            <form th:action="@{/officer/change-password}" method="post">
                                <div class="row g-3">
                                    <div class="col-md-4">
                                        <label class="cr-form-label">Current Password</label>
                                        <input type="password" name="currentPassword" class="form-control"/>
                                    </div>
                                    <div class="col-md-4">
                                        <label class="cr-form-label">New Password</label>
                                        <input type="password" name="newPassword" class="form-control"/>
                                    </div>
                                    <div class="col-md-4">
                                        <label class="cr-form-label">Confirm Password</label>
                                        <input type="password" name="confirmPassword" class="form-control"/>
                                    </div>
                                    <div class="col-12 d-flex justify-content-end">
                                        <button type="submit" class="btn btn-primary fw-600">Update Password</button>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
