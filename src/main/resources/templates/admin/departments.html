<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Departments')}">
    <link th:href="@{/css/admin.css}" rel="stylesheet"/>
</head>
<body>
<div class="cr-dashboard-layout">
    <th:block th:replace="~{fragments/admin-sidebar :: admin-sidebar}"/>
    <div class="cr-dashboard-main">
        <div class="cr-topbar">
            <div class="d-flex align-items-center gap-2">
                <h1 class="cr-topbar-title">Departments</h1>
            </div>
        </div>
        <main class="cr-page-content">
            <th:block th:replace="~{fragments/alerts :: alerts}"/>
            <div class="row g-3 mb-4">
                <div class="col-6 col-xl-4"><div class="cr-stat-card">
                    <div class="cr-stat-icon cr-stat-icon--blue"><i class="fa-solid fa-building"></i></div>
                    <div><div class="cr-stat-value" th:text="${totalDepartments}">0</div><div class="cr-stat-label">Departments</div></div>
                </div></div>
                <div class="col-6 col-xl-4"><div class="cr-stat-card">
                    <div class="cr-stat-icon cr-stat-icon--orange"><i class="fa-solid fa-clipboard-list"></i></div>
                    <div><div class="cr-stat-value" th:text="${totalComplaints}">0</div><div class="cr-stat-label">Complaints</div></div>
                </div></div>
                <div class="col-6 col-xl-4"><div class="cr-stat-card">
                    <div class="cr-stat-icon cr-stat-icon--purple"><i class="fa-solid fa-user-shield"></i></div>
                    <div><div class="cr-stat-value" th:text="${totalOfficers}">0</div><div class="cr-stat-label">Officers</div></div>
                </div></div>
            </div>
            <div class="cr-card">
                <div class="table-responsive">
                    <table class="cr-table">
                        <thead><tr><th>Department</th><th>Service sector</th><th>Complaints</th><th>Open</th><th>Officers</th></tr></thead>
                        <tbody>
                        <tr th:each="department : ${departments}">
                            <td class="fw-600" th:text="${department.department}">Department</td>
                            <td th:text="${department.sector}">Sector</td>
                            <td th:text="${department.complaintCount}">0</td>
                            <td th:text="${department.openComplaintCount}">0</td>
                            <td th:text="${department.officerCount}">0</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
