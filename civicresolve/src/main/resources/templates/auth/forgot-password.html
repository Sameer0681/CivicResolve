<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Forgot Password')}">
    <link th:href="@{/css/auth.css}" rel="stylesheet"/>
</head>
<body>
<div class="cr-auth-page">
    <div class="cr-auth-panel">
        <a th:href="@{/}" class="d-flex align-items-center gap-2 text-decoration-none mb-4">
            <div class="cr-logo-icon"><i class="fa-solid fa-landmark"></i></div>
            <span class="cr-brand-text">Civic<span class="cr-brand-accent">Resolve</span></span>
        </a>

        <div class="mb-4">
            <div style="width:56px;height:56px;background:var(--cr-primary-light);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.4rem;color:var(--cr-primary);margin-bottom:1rem;">
                <i class="fa-solid fa-key"></i>
            </div>
            <h1 class="cr-auth-title">Forgot your password?</h1>
            <p class="cr-auth-subtitle">No worries. Enter your email and we'll send you a reset link.</p>
        </div>

        <th:block th:replace="~{fragments/alerts :: alerts}"/>

        <form th:action="@{/forgot-password}" method="post">
            <div class="mb-4">
                <label class="cr-form-label">Email Address</label>
                <div class="cr-input-icon-wrap">
                    <i class="cr-input-icon fa-solid fa-envelope"></i>
                    <input type="email" name="email" class="form-control" placeholder="you@example.com" required autofocus/>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fw-600">
                <i class="fa-solid fa-paper-plane me-2"></i>Send Reset Link
            </button>
        </form>

        <p class="text-center text-muted small mt-4 mb-0">
            Remember your password?
            <a th:href="@{/login}" class="fw-600 text-decoration-none">Back to login</a>
        </p>
    </div>

    <div class="cr-auth-visual">
        <div class="cr-auth-visual-content">
            <div class="cr-auth-visual-icon"><i class="fa-solid fa-envelope-open-text"></i></div>
            <h2>Check your inbox</h2>
            <p>We'll send a secure password reset link to your registered email address within a few minutes.</p>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
