<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Complaint Details')}">
    <link th:href="@{/css/citizen.css}" rel="stylesheet"/>
</head>
<body>
<div class="cr-dashboard-layout">
    <th:block th:replace="~{fragments/citizen-sidebar :: citizen-sidebar}"/>
    <div class="cr-dashboard-main">
        <div class="cr-topbar">
            <div class="d-flex align-items-center gap-2">
                <a th:href="@{/citizen/complaints}" class="btn btn-sm btn-light">
                    <i class="fa-solid fa-arrow-left"></i>
                </a>
                <h1 class="cr-topbar-title">Complaint Details</h1>
            </div>
        </div>
        <div class="cr-page-content">
            <th:block th:replace="~{fragments/alerts :: alerts}"/>

            <div class="card border-0 shadow-sm" th:if="${complaint != null}">
                <div class="card-body p-4">
                    <div class="text-muted small fw-700">REFERENCE ID</div>
                    <div class="font-monospace fs-5 text-primary mb-4" th:text="${complaint.complaintId}"></div>

                    <div class="row g-3">
                        <div class="col-12">
                            <div class="text-muted small fw-700">SUBJECT</div>
                            <div class="fw-700" th:text="${complaint.title}"></div>
                        </div>
                        <div class="col-12">
                            <div class="text-muted small fw-700">DESCRIPTION</div>
                            <div th:text="${complaint.description}"></div>
                        </div>
                        <div class="col-sm-6">
                            <div class="text-muted small fw-700">SECTOR</div>
                            <div th:text="${complaint.sector}"></div>
                        </div>
                        <div class="col-sm-6" th:if="${complaint.department != null and !#strings.isEmpty(complaint.department)}">
                            <div class="text-muted small fw-700">DEPARTMENT</div>
                            <div th:text="${complaint.department}"></div>
                        </div>
                        <div class="col-12" th:if="${complaint.location != null and !#strings.isEmpty(complaint.location)}">
                            <div class="text-muted small fw-700">LOCATION</div>
                            <div th:text="${complaint.location}"></div>
                        </div>
                        <div class="col-sm-6">
                            <div class="text-muted small fw-700">STATUS</div>
                            <span class="cr-status"
                                  th:classappend="${' cr-status--' + #strings.toLowerCase(complaint.status.name())}"
                                  th:text="${#strings.replace(complaint.status.name(), '_', ' ')}">SUBMITTED</span>
                        </div>
                        <div class="col-sm-6" th:if="${complaint.createdAt != null}">
                            <div class="text-muted small fw-700">SUBMITTED</div>
                            <div th:text="${complaint.createdAt}"></div>
                        </div>
                        <div class="col-sm-6" th:if="${complaint.updatedAt != null}">
                            <div class="text-muted small fw-700">LAST UPDATED</div>
                            <div th:text="${complaint.updatedAt}"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card border-0 shadow-sm" th:unless="${complaint != null}">
                <div class="card-body p-4 text-center">
                    <i class="fa-solid fa-clipboard-list text-muted fa-2x mb-3"></i>
                    <h2 class="h5 fw-700">No complaint selected</h2>
                    <p class="text-muted mb-3">Select a complaint from your list or submit a new one.</p>
                    <a th:href="@{/citizen/complaints}" class="btn btn-outline-primary me-2">My complaints</a>
                    <a th:href="@{/report}" class="btn btn-primary">Submit a complaint</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
