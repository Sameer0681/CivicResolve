<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('My Profile')}">
    <link th:href="@{/css/officer.css}" rel="stylesheet"/>
</head>
<body>
<div class="cr-dashboard-layout">
    <th:block th:replace="~{fragments/officer-sidebar :: officer-sidebar}"/>
    <div class="cr-dashboard-main">
        <div class="cr-topbar">
            <div class="d-flex align-items-center gap-2">
                <h1 class="cr-topbar-title">My Profile</h1>
            </div>
        </div>
        <div class="cr-page-content">
            <th:block th:replace="~{fragments/alerts :: alerts}"/>
            <div class="row g-4">
                <div class="col-lg-4">
                    <div class="cr-card text-center">
                        <div class="cr-card-body">
                            <div class="cr-avatar cr-avatar--lg cr-avatar--officer mx-auto mb-3" style="width:80px;height:80px;font-size:2rem;">
                                <i class="fa-solid fa-user-shield"></i>
                            </div>
                            <h5 class="fw-700 mb-1" th:text="${user?.fullName}"></h5>
                            <p class="text-muted small mb-2" th:text="${user?.email}"></p>
                            <span class="cr-badge cr-badge--officer">Officer</span>
                            <hr/>
                            <div class="text-muted small" th:if="${user?.department}" th:text="${user.department}"></div>
                        </div>
                    </div>
                </div>
                <div class="col-lg-8">
                    <div class="cr-card">
                        <div class="cr-card-header">
                            <h6 class="fw-700 mb-0">Personal Information</h6>
                        </div>
                        <div class="cr-card-body">
                            <form th:action="@{/officer/profile}" method="post">
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label class="cr-form-label">First Name</label>
                                        <input type="text" name="firstName" class="form-control" th:value="${user?.firstName}" maxlength="80" required/>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="cr-form-label">Last Name</label>
                                        <input type="text" name="lastName" class="form-control" th:value="${user?.lastName}" maxlength="80" required/>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="cr-form-label">Email</label>
                                        <input type="email" class="form-control" th:value="${user?.email}" disabled/>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="cr-form-label">Phone</label>
                                        <input type="tel" class="form-control" th:value="${user?.phone}" disabled/>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="cr-form-label">Department</label>
                                        <input type="text" class="form-control" th:value="${user?.department}" disabled/>
                                    </div>
                                    <div class="col-12 d-flex justify-content-end gap-2">
                                        <button type="reset" class="btn btn-light">Cancel</button>
                                        <button type="submit" class="btn btn-primary fw-600">Save Changes</button>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>

                    <div class="cr-card mt-4">
                        <div class="cr-card-header">
                            <h6 class="fw-700 mb-0">Change Password</h6>
                        </div>
                        <div class="cr-card-body">
                            <form th:action="@{/officer/change-password}" method="post">
                                <div class="row g-3">
                                    <div class="col-md-4">
                                        <label class="cr-form-label">Current Password</label>
                                        <input type="password" name="currentPassword" class="form-control" required autocomplete="current-password"/>
                                    </div>
                                    <div class="col-md-4">
                                        <label class="cr-form-label">New Password</label>
                                        <input type="password" name="newPassword" class="form-control" required minlength="8" autocomplete="new-password"/>
                                    </div>
                                    <div class="col-md-4">
                                        <label class="cr-form-label">Confirm Password</label>
                                        <input type="password" name="confirmPassword" class="form-control" required minlength="8" autocomplete="new-password"/>
                                    </div>
                                    <div class="col-12 d-flex justify-content-end">
                                        <button type="submit" class="btn btn-primary fw-600">Update Password</button>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
