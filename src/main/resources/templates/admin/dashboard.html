<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Admin Dashboard')}">
    <link th:href="@{/css/admin.css}" rel="stylesheet"/>
</head>
<body>
<div class="cr-dashboard-layout">
    <th:block th:replace="~{fragments/admin-sidebar :: admin-sidebar}"/>
    <div class="cr-dashboard-main">
        <div class="cr-topbar">
            <h1 class="cr-topbar-title">Admin Dashboard</h1>
            <a th:href="@{/admin/escalations}" class="text-muted"><i class="fa-solid fa-bell fa-lg"></i></a>
        </div>
        <div class="cr-page-content">
            <th:block th:replace="~{fragments/alerts :: alerts}"/>
            <div class="mb-4">
                <h4 class="fw-700 mb-1">Platform overview</h4>
                <p class="text-muted small mb-0">Live platform metrics will appear here when available.</p>
            </div>
            <div class="cr-card p-4 text-center text-muted">
                <i class="fa-solid fa-chart-line fa-2x mb-2"></i>
                <p class="mb-0">No dashboard metrics are available.</p>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
