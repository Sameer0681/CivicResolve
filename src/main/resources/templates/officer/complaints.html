<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Assigned Complaints')}">
    <link th:href="@{/css/officer.css}" rel="stylesheet"/>
</head>
<body>
<div class="cr-dashboard-layout">
    <th:block th:replace="~{fragments/officer-sidebar :: officer-sidebar}"/>
    <div class="cr-dashboard-main">
        <div class="cr-topbar"><h1 class="cr-topbar-title">Assigned Complaints</h1></div>
        <div class="cr-page-content">
            <th:block th:replace="~{fragments/alerts :: alerts}"/>
            <div class="cr-card mb-4">
                <div class="cr-card-body">
                    <form method="get" th:action="@{/officer/complaints}" class="row g-3 align-items-end">
                        <div class="col-md-7">
                            <label class="cr-form-label" for="complaintSearch">Search complaints</label>
                            <input id="complaintSearch" type="search" name="search" class="form-control"
                                   placeholder="Reference, title, or sector" th:value="${search}"/>
                        </div>
                        <div class="col-md-3">
                            <label class="cr-form-label" for="complaintStatus">Status</label>
                            <select id="complaintStatus" name="status" class="form-select">
                                <option value="">All statuses</option>
                                <option th:each="statusOption : ${statuses}" th:value="${statusOption.name()}"
                                        th:text="${#strings.replace(statusOption.name(), '_', ' ')}"
                                        th:selected="${statusFilter == statusOption.name()}">Submitted</option>
                            </select>
                        </div>
                        <div class="col-md-2"><button class="btn btn-primary w-100" type="submit">Filter</button></div>
                    </form>
                </div>
            </div>
            <div class="cr-complaint-list" th:if="${!#lists.isEmpty(complaints)}">
                <article class="cr-complaint-card" th:each="complaint : ${complaints}">
                    <div class="cr-complaint-card-main">
                        <div class="d-flex flex-wrap align-items-center gap-2 mb-2">
                            <span class="cr-complaint-id-tag" th:text="${complaint.complaintId}">CR-000</span>
                            <span class="cr-status"
                                  th:classappend="${' cr-status--' + #strings.toLowerCase(complaint.status.name())}"
                                  th:text="${#strings.replace(complaint.status.name(), '_', ' ')}">SUBMITTED</span>
                        </div>
                        <h2 class="h6 fw-700 mb-1" th:text="${complaint.title}">Complaint title</h2>
                        <div class="cr-complaint-meta">
                            <span th:text="${complaint.sector}">Sector</span>
                            <span th:if="${complaint.createdAt != null}" th:text="${complaint.createdAt}">Date</span>
                        </div>
                    </div>
                    <a class="btn btn-outline-primary btn-sm cr-complaint-track-link"
                       th:href="@{/officer/complaint-details(id=${complaint.id})}">View and update</a>
                </article>
            </div>
            <div class="cr-card p-4 text-center text-muted" th:if="${#lists.isEmpty(complaints)}">
                <i class="fa-regular fa-folder-open fa-2x mb-2"></i>
                <p class="mb-0">No complaints match your filters.</p>
            </div>
        </div>
    </div>
</div>
</body>
</html>
